<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Imperial Chess Master</title>
  <style>
    :root {
      --bg-dark: radial-gradient(circle at center, #26160c 0%, #080402 100%);
      --gold-accent: #d4af37;
      --wood-frame: #3b2210;
      --panel-marble: linear-gradient(180deg, #3d2a1a 0%, #1c1108 100%);
    }

    * { box-sizing: border-box; touch-action: manipulation; user-select: none; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; padding: 0;
      background: var(--bg-dark);
      color: #e5e5e5;
      font-family: 'Georgia', serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden;
    }

    /* Main Container */
    .app-container {
      width: 95vw; max-width: 420px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }

    .app-title {
      font-size: 1.4rem; font-weight: bold; color: var(--gold-accent);
      letter-spacing: 3px; text-transform: uppercase;
      text-shadow: 0 0 15px rgba(212, 175, 55, 0.4); margin-bottom: 2px;
    }

    /* Captured Pieces Tray */
    .captured-tray {
      width: 100%; height: 26px;
      background: rgba(15, 9, 5, 0.8);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 4px;
      display: flex; align-items: center; padding: 0 8px; gap: 3px;
      font-size: 1.1rem; overflow: hidden;
    }

    /* 3D Board Frame */
    .board-viewport {
      width: 100%; height: 95vw; max-height: 400px;
      perspective: 1000px; margin: 4px 0;
    }

    .board-3d-frame {
      width: 100%; height: 100%;
      background: linear-gradient(145deg, #4a2d17, #1a0e06);
      border-radius: 12px; padding: 12px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.95), inset 0 0 15px rgba(0,0,0,0.8);
      transform: rotateX(24deg); transition: transform 0.4s ease;
      box-sizing: border-box;
    }

    .chess-grid {
      width: 100%; height: 100%; display: grid;
      grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
      border-radius: 4px; overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }

    .square {
      position: relative; display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem; cursor: pointer;
    }

    .sq-light { background-color: #d8b888; }
    .sq-dark { background-color: #4a2810; }

    .sq-selected { box-shadow: inset 0 0 0 3px #fff3a8 !important; background: rgba(212, 175, 55, 0.6) !important; }
    .sq-hint::after {
      content: ''; width: 28%; height: 28%; background: rgba(212, 175, 55, 0.9);
      border-radius: 50%; box-shadow: 0 0 8px #fff3a8;
    }

    /* Checkmate Overlay */
    .banner-overlay {
      position: absolute; top: 20%; left: 4%; right: 4%;
      background: var(--panel-marble); border: 2px solid var(--gold-accent);
      border-radius: 10px; padding: 20px; text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.95); display: none; z-index: 100;
    }

    .king-clash {
      display: flex; justify-content: center; align-items: center; gap: 15px;
      font-size: 3rem; margin-bottom: 10px;
    }
    .king-fallen { transform: rotate(90deg) translateY(-10px); opacity: 0.7; }

    /* Control Panel Away From Board */
    .controls-panel {
      width: 100%; display: flex; justify-content: space-between; gap: 10px; margin-top: 6px;
    }

    .carved-btn {
      flex: 1; padding: 12px;
      background: var(--panel-marble);
      border: 1.5px solid var(--gold-accent);
      border-radius: 6px; color: var(--gold-accent);
      font-weight: bold; letter-spacing: 1px; cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.7); text-align: center;
      transition: all 0.2s;
    }

    .carved-btn:active { transform: translateY(2px); background: var(--gold-accent); color: #000; }

    /* Modal */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 300; }
    .modal-content { background: #1c1108; border: 2px solid var(--gold-accent); border-radius: 10px; width: 88vw; max-width: 360px; padding: 20px; }
    .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(212,175,55,0.2); font-size: 0.85rem; }
    select, input[type="checkbox"] { background: #000; color: var(--gold-accent); border: 1px solid var(--gold-accent); padding: 5px; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="app-title">Imperial Chess</div>

    <!-- Black Captured Pieces Tray -->
    <div class="captured-tray" id="blackCaptured"></div>

    <div class="board-viewport">
      <div class="board-3d-frame" id="boardFrame">
        <div class="chess-grid" id="chessGrid"></div>
      </div>

      <!-- Checkmate Banner Overlay -->
      <div class="banner-overlay" id="bannerOverlay">
        <div class="king-clash">
          <span style="color:#fff;">♔</span>
          <span class="king-fallen" style="color:#888;">♚</span>
        </div>
        <div style="font-size:1.6rem; color:#ef4444; font-weight:bold; letter-spacing:2px;">ÉCHEC ET MAT!</div>
        <div id="bannerSub" style="color:var(--gold-accent); margin-top:4px;">Victory is claimed!</div>
        <button class="carved-btn" style="margin-top:15px;" onclick="restartGame()">REPLAY MATCH</button>
      </div>
    </div>

    <!-- White Captured Pieces Tray -->
    <div class="captured-tray" id="whiteCaptured"></div>

    <!-- Carved Controls -->
    <div class="controls-panel">
      <button class="carved-btn" onclick="undoMove()">UNDO</button>
      <button class="carved-btn" onclick="restartGame()">RESTART</button>
      <button class="carved-btn" style="max-width: 60px;" onclick="toggleModal(true)">⚙</button>
    </div>
  </div>

  <!-- Options Modal -->
  <div class="modal" id="optionsModal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3 style="margin:0; color:var(--gold-accent);">SETTINGS</h3>
        <button class="carved-btn" style="padding:4px 10px;" onclick="toggleModal(false)">✕</button>
      </div>

      <div class="setting-row">
        <span>AI Difficulty</span>
        <select id="aiLevel">
          <option value="11" selected>11. Highly Advanced AI</option>
          <option value="10">10. Grandmaster</option>
          <option value="9">9. Kasparov Level</option>
          <option value="5">5. Intermediate</option>
        </select>
      </div>

      <div class="setting-row">
        <span>Dynamic Audiomachine Music</span>
        <input type="checkbox" id="musicToggle" checked onchange="toggleMusic(this.checked)">
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script>
    let game = new Chess();
    let selectedSquare = null;
    let whiteCaptured = [], blackCaptured = [];
    
    const symbols = {
      'w': { 'p': '♙', 'r': '♖', 'n': '♘', 'b': '♗', 'q': '♕', 'k': '♔' },
      'b': { 'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚' }
    };

    // Web Audio Dynamic Synthesizer (Audiomachine Style Adaptive Tempo)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let musicTimer = null, musicTempo = 2200;

    function playWoodSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(type === 'capture' ? 75 : 135, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    function speakCheckmate() {
      if ('speechSynthesis' in window) {
        const msg = new SpeechSynthesisUtterance("Checkmate");
        msg.rate = 0.85; msg.pitch = 0.7;
        window.speechSynthesis.speak(msg);
      }
    }

    function playAdaptiveMusic() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      let step = 0;
      const chords = [65.41, 69.30, 58.27, 55.00, 73.42];
      
      if (musicTimer) clearInterval(musicTimer);
      musicTimer = setInterval(() => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(chords[step % chords.length], audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.0);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 2.0);
        step++;
      }, musicTempo);
    }

    function toggleMusic(enable) {
      if (enable) playAdaptiveMusic();
      else if (musicTimer) clearInterval(musicTimer);
    }

    function renderBoard() {
      const grid = document.getElementById('chessGrid');
      grid.innerHTML = '';
      const boardState = game.board();

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sqName = String.fromCharCode(97 + c) + (8 - r);
          const sqDiv = document.createElement('div');
          sqDiv.className = `square ${(r + c) % 2 === 0 ? 'sq-light' : 'sq-dark'}`;
          sqDiv.dataset.square = sqName;

          const piece = boardState[r][c];
          if (piece) {
            sqDiv.innerHTML = symbols[piece.color][piece.type];
            sqDiv.style.color = piece.color === 'w' ? '#ffffff' : '#0a0a0a';
            sqDiv.style.textShadow = piece.color === 'w' ? '0 2px 4px #000' : '0 1px 2px #fff';
          }

          if (selectedSquare === sqName) sqDiv.classList.add('sq-selected');
          sqDiv.onclick = () => onSquareClick(sqName);
          grid.appendChild(sqDiv);
        }
      }
    }

    function onSquareClick(sq) {
      if (!selectedSquare) {
        const piece = game.get(sq);
        if (piece && piece.color === game.turn()) {
          selectedSquare = sq;
          renderBoard();
          showHints(sq);
        }
        return;
      }

      const move = game.move({ from: selectedSquare, to: sq, promotion: 'q' });
      if (move) {
        if (move.captured) {
          (move.color === 'w' ? whiteCaptured : blackCaptured).push(symbols[move.color === 'w' ? 'b' : 'w'][move.captured]);
          updateTrays();
          musicTempo = Math.max(1200, musicTempo - 200); // Accelerate music on aggressive moves
          playAdaptiveMusic();
        }
        playWoodSound(move.captured ? 'capture' : 'move');
        selectedSquare = null;
        renderBoard();
        checkGameState();

        if (!game.game_over() && game.turn() === 'b') {
          setTimeout(makeAggressiveAIMove, 300);
        }
      } else {
        selectedSquare = null;
        renderBoard();
      }
    }

    function showHints(sq) {
      game.moves({ square: sq, verbose: true }).forEach(m => {
        const el = document.querySelector(`[data-square="${m.to}"]`);
        if (el) el.classList.add('sq-hint');
      });
    }

    function updateTrays() {
      document.getElementById('whiteCaptured').innerText = whiteCaptured.join(' ');
      document.getElementById('blackCaptured').innerText = blackCaptured.join(' ');
    }

    // Aggressive AI Engine (Always pushing forward)
    function evaluateAggressive(board) {
      const values = { p: 10, n: 32, b: 33, r: 50, q: 95, k: 1000 };
      let score = 0;
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const piece = board[r][c];
          if (piece) {
            let val = values[piece.type];
            // Bonus for advancing forward to choke opponent
            if (piece.color === 'b') val += (7 - r) * 2;
            score += (piece.color === 'b' ? val : -val);
          }
        }
      }
      return score;
    }

    function makeAggressiveAIMove() {
      const moves = game.moves({ verbose: true });
      if (moves.length === 0) return;

      let bestMove = moves[0];
      let bestScore = -99999;

      moves.forEach(m => {
        game.move(m);
        let score = evaluateAggressive(game.board());
        game.undo();
        if (score > bestScore) {
          bestScore = score;
          bestMove = m;
        }
      });

      const move = game.move(bestMove);
      if (move.captured) {
        blackCaptured.push(symbols['w'][move.captured]);
        updateTrays();
      }
      playWoodSound(move.captured ? 'capture' : 'move');
      renderBoard();
      checkGameState();
    }

    function checkGameState() {
      if (game.in_checkmate()) {
        speakCheckmate();
        document.getElementById('bannerOverlay').style.display = 'block';
      }
    }

    function undoMove() { game.undo(); game.undo(); selectedSquare = null; renderBoard(); }
    function restartGame() {
      game.reset(); selectedSquare = null; whiteCaptured = []; blackCaptured = [];
      updateTrays(); document.getElementById('bannerOverlay').style.display = 'none';
      renderBoard();
    }

    function toggleModal(show) { document.getElementById('optionsModal').style.display = show ? 'flex' : 'none'; }

    renderBoard();
    playAdaptiveMusic();
  </script>
</body>
</html>
