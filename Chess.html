<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Imperial Chess - شطرنج الإمبراطور</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <style>
    :root {
      --bg-dark: #121212;
      --panel-bg: #1e1e1e;
      --gold: #d4af37;
      --gold-hover: #f3e5ab;
      --text-color: #f5f5f5;
    }
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 10px;
      background-color: var(--bg-dark);
      color: var(--text-color);
      font-family: system-ui, -apple-system, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .header {
      text-align: center;
      margin-bottom: 12px;
    }
    .header h1 {
      margin: 0;
      font-size: 1.6rem;
      color: var(--gold);
      letter-spacing: 1px;
    }
    .board-container {
      width: 100%;
      max-width: 400px;
      background: #2a2a2a;
      padding: 10px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      border: 2px solid var(--gold);
    }
    #board {
      width: 100%;
    }
    .controls {
      margin-top: 15px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .status-panel {
      background: var(--panel-bg);
      padding: 10px 15px;
      border-radius: 8px;
      text-align: center;
      font-size: 0.95rem;
      color: #ccc;
      border: 1px solid #333;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: var(--gold);
      color: #000;
      transition: background 0.2s;
    }
    button:active {
      background-color: var(--gold-hover);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>IMPERIAL CHESS</h1>
  </div>

  <div class="board-container">
    <div id="board"></div>
  </div>

  <div class="controls">
    <div class="status-panel" id="status">دور اللاعب (الأبيض)</div>
    <div class="btn-group">
      <button onclick="resetGame()">مباراة جديدة</button>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

  <script>
    let board = null;
    let game = new Chess();
    const $status = $('#status');

    function onDragStart (source, piece) {
      if (game.game_over()) return false;
      if (piece.search(/^b/) !== -1) return false;
    }

    function makeRandomMove () {
      const possibleMoves = game.moves();
      if (possibleMoves.length === 0) return;

      const randomIdx = Math.floor(Math.random() * possibleMoves.length);
      game.move(possibleMoves[randomIdx]);
      board.position(game.fen());
      updateStatus();
    }

    function onDrop (source, target) {
      const move = game.move({
        from: source,
        to: target,
        promotion: 'q'
      });

      if (move === null) return 'snapback';

      updateStatus();
      window.setTimeout(makeRandomMove, 250);
    }

    function onSnapEnd () {
      board.position(game.fen());
    }

    function updateStatus () {
      let status = '';
      let moveColor = game.turn() === 'b' ? 'الأسود' : 'الأبيض';

      if (game.in_checkmate()) {
        status = 'انتهت اللعبة، كش ملك! الفائز: ' + (game.turn() === 'w' ? 'الأسود' : 'الأبيض');
      } else if (game.in_draw()) {
        status = 'انتهت اللعبة بالتعادل!';
      } else {
        status = 'دور: ' + moveColor;
        if (game.in_check()) {
          status += ' (كش ملك!)';
        }
      }
      $status.html(status);
    }

    const config = {
      draggable: true,
      position: 'start',
      onDragStart: onDragStart,
      onDrop: onDrop,
      onSnapEnd: onSnapEnd,
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    };

    board = Chessboard('board', config);
    updateStatus();

    function resetGame() {
      game.reset();
      board.start();
      updateStatus();
    }
  </script>
</body>
</html>
