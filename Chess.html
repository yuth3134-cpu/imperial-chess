<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Imperial Chess Master 3D</title>
  <style>
    :root {
      --bg-radial: radial-gradient(circle at center, #1f1208 0%, #050201 100%);
      --gold-main: #d4af37;
      --gold-light: #fff3a8;
      --panel-bg: rgba(18, 12, 8, 0.96);
    }

    * { box-sizing: border-box; touch-action: manipulation; user-select: none; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; padding: 0;
      background: var(--bg-radial);
      color: #e5e5e5;
      font-family: 'Georgia', serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden;
    }

    /* Portal Menu */
    .portal-screen {
      position: fixed; inset: 0; background: var(--bg-radial); z-index: 200;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 20px;
    }
    .portal-title {
      font-size: 2.2rem; font-weight: bold; color: var(--gold-main); text-transform: uppercase;
      letter-spacing: 4px; text-shadow: 0 0 25px rgba(212, 175, 55, 0.6); text-align: center;
    }
    .menu-btn {
      width: 85vw; max-width: 320px; padding: 16px;
      background: linear-gradient(180deg, #4a3319 0%, #1a0f06 100%);
      border: 2px solid var(--gold-main); border-radius: 8px; color: var(--gold-light);
      font-size: 1.1rem; font-weight: bold; letter-spacing: 2px; cursor: pointer;
      box-shadow: 0 8px 25px rgba(0,0,0,0.9); text-align: center; transition: all 0.2s;
    }
    .menu-btn:active { transform: scale(0.97); background: var(--gold-main); color: #000; }

    /* Game Interface */
    .app-header {
      width: 92vw; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    }
    .icon-btn {
      background: rgba(212, 175, 55, 0.15); border: 1px solid var(--gold-main); color: var(--gold-main);
      width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; cursor: pointer;
    }

    .board-container {
      width: 92vw; height: 92vw; max-width: 400px; max-height: 400px; position: relative; perspective: 900px;
    }
    .board-frame {
      width: 100%; height: 100%; border-radius: 12px; padding: 10px; border: 3px solid var(--gold-main);
      box-shadow: 0 25px 50px rgba(0,0,0,0.9), 0 0 20px rgba(212, 175, 55, 0.3);
      transition: transform 0.4s ease;
    }
    .mode-3d { transform: rotateX(22deg) scale(0.96); }
    .mode-2d { transform: rotateX(0deg) scale(1); }

    .chess-grid {
      width: 100%; height: 100%; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
      border-radius: 4px; overflow: hidden;
    }
    .square {
      position: relative; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; cursor: pointer;
    }

    /* Wooden Themes */
    .wood-1 .sq-l { background: #e0d0b0; } .wood-1 .sq-d { background: #8b5a2b; }
    .wood-2 .sq-l { background: #d2b48c; } .wood-2 .sq-d { background: #5c4033; }
    .wood-3 .sq-l { background: #f0d9b5; } .wood-3 .sq-d { background: #b58863; }
    .wood-4 .sq-l { background: #e2c499; } .wood-4 .sq-d { background: #6a3812; }
    .wood-5 .sq-l { background: #dfd3c3; } .wood-5 .sq-d { background: #3b2f2f; }
    .wood-6 .sq-l { background: #e6ccab; } .wood-6 .sq-d { background: #804000; }
    .wood-7 .sq-l { background: #dec29b; } .wood-7 .sq-d { background: #4a2f13; }
    .wood-8 .sq-l { background: #d9c0a3; } .wood-8 .sq-d { background: #734d26; }
    .wood-9 .sq-l { background: #cccccc; } .wood-9 .sq-d { background: #404040; }
    .wood-10 .sq-l { background: #262626; } .wood-10 .sq-d { background: #0d0d0d; }

    .sq-selected { box-shadow: inset 0 0 0 3px var(--gold-light) !important; background: rgba(212, 175, 55, 0.6) !important; }
    .sq-hint::after {
      content: ''; width: 30%; height: 30%; background: rgba(212, 175, 55, 0.9); border-radius: 50%; box-shadow: 0 0 8px var(--gold-light);
    }

    /* Go Stone Piece Style */
    .go-piece {
      width: 80%; height: 80%; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; font-weight: bold; box-shadow: inset 0 3px 6px rgba(255,255,255,0.4), 0 4px 8px rgba(0,0,0,0.6);
    }
    .go-white { background: radial-gradient(circle at 30% 30%, #ffffff, #c5c5c5); color: #111; border: 1px solid #999; }
    .go-black { background: radial-gradient(circle at 30% 30%, #444444, #111111); color: #f1f1f1; border: 1px solid #000; }

    /* Checkmate Overlay with Falling King */
    .banner-overlay {
      position: absolute; top: 25%; left: 5%; right: 5%;
      background: rgba(15, 10, 6, 0.97); border: 2px solid var(--gold-main); border-radius: 12px;
      padding: 20px; text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.9); display: none; z-index: 50;
    }
    .falling-king { font-size: 3.5rem; animation: fallKing 1.2s ease forwards; display: inline-block; margin-bottom: 5px; }
    @keyframes fallKing {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(20px) rotate(90deg); opacity: 0.6; }
    }

    .status-panel {
      width: 92vw; max-width: 400px; margin-top: 12px; background: var(--panel-bg);
      border: 1px solid var(--gold-main); border-radius: 8px; padding: 10px 15px;
      display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; font-weight: bold;
    }
    .timer-box { font-family: monospace; font-size: 1rem; color: var(--gold-main); background: #000; padding: 3px 8px; border-radius: 4px; border: 1px solid #333; }

    .controls { width: 92vw; max-width: 400px; margin-top: 10px; display: flex; gap: 10px; }
    .ctrl-btn {
      flex: 1; padding: 12px; background: linear-gradient(180deg, #3d2817 0%, #1a1008 100%);
      border: 1px solid var(--gold-main); color: var(--gold-main); border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center;
    }

    /* Modal */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 300; }
    .modal-content { background: #1a110a; border: 2px solid var(--gold-main); border-radius: 12px; width: 88vw; max-width: 360px; padding: 20px; max-height: 85vh; overflow-y: auto; }
    .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(212,175,55,0.2); font-size: 0.85rem; }
    select, input[type="checkbox"] { background: #000; color: var(--gold-main); border: 1px solid var(--gold-main); padding: 6px; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- PORTAL MENU -->
  <div class="portal-screen" id="portalMenu">
    <div class="portal-title">Imperial Chess</div>
    <div class="menu-btn" onclick="startGame()">⚔ SINGLE PLAYER</div>
    <div class="menu-btn" onclick="toggleModal(true)">⚙ OPTIONS</div>
  </div>

  <!-- GAME INTERFACE -->
  <div class="app-header">
    <button class="icon-btn" onclick="showPortal()">🏠</button>
    <div style="font-weight:bold; color:var(--gold-main); letter-spacing:2px;">IMPERIAL CHESS</div>
    <button class="icon-btn" onclick="toggleModal(true)">⚙</button>
  </div>

  <div class="board-container">
    <div class="board-frame mode-3d wood-1" id="boardFrame">
      <div class="chess-grid" id="chessGrid"></div>
    </div>
    
    <div class="banner-overlay" id="bannerOverlay">
      <div class="falling-king" id="fallingKingIcon">♔</div>
      <div style="font-size:1.5rem; color:#ef4444; font-weight:bold; letter-spacing:2px;">ÉCHEC ET MAT!</div>
      <div id="bannerSub" style="color:var(--gold-light); margin-top:5px;">Your opponent won!</div>
      <button class="ctrl-btn" style="margin-top:15px;" onclick="restartGame()">Play Again</button>
    </div>
  </div>

  <div class="status-panel">
    <div class="timer-box" id="bTimer">10:00</div>
    <span id="turnText" style="color:var(--gold-main);">WHITE TO MOVE</span>
    <div class="timer-box" id="wTimer">10:00</div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" onclick="undoMove()">↩ UNDO</button>
    <button class="ctrl-btn" onclick="restartGame()">⚔ RESTART</button>
  </div>

  <!-- OPTIONS MODAL -->
  <div class="modal" id="optionsModal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3 style="margin:0; color:var(--gold-main);">OPTIONS</h3>
        <button class="icon-btn" style="width:30px; height:30px;" onclick="toggleModal(false)">✕</button>
      </div>

      <div class="setting-row">
        <span>View Mode</span>
        <select id="viewMode" onchange="setViewMode(this.value)">
          <option value="mode-3d">3D View</option>
          <option value="mode-2d">2D Flat View</option>
        </select>
      </div>

      <div class="setting-row">
        <span>Wooden Table Style</span>
        <select id="woodTheme" onchange="setWoodTheme(this.value)">
          <option value="wood-1">1. Dark Oak</option>
          <option value="wood-2">2. Mahogany</option>
          <option value="wood-3">3. Vintage Walnut</option>
          <option value="wood-4">4. Rosewood</option>
          <option value="wood-5">5. Smoked Ash</option>
          <option value="wood-6">6. Cedar</option>
          <option value="wood-7">7. Teak</option>
          <option value="wood-8">8. Chestnut</option>
          <option value="wood-9">9. Steel Gray</option>
          <option value="wood-10">10. Obsidian</option>
        </select>
      </div>

      <div class="setting-row">
        <span>Piece Style</span>
        <select id="pieceStyle" onchange="setPieceStyle(this.value)">
          <option value="classic">Classic Symbols</option>
          <option value="go">Go Stones (With Symbols)</option>
        </select>
      </div>

      <div class="setting-row">
        <span>AI Difficulty</span>
        <select id="aiLevel">
          <option value="1">1. Novice</option>
          <option value="2">2. Learner</option>
          <option value="3">3. Apprentice</option>
          <option value="4">4. Intermediate</option>
          <option value="5">5. Advanced</option>
          <option value="6">6. Expert</option>
          <option value="7">7. Genius</option>
          <option value="8">8. Master</option>
          <option value="9">9. Kasparov Level</option>
          <option value="10">10. Grandmaster</option>
          <option value="11" selected>11. Highly Advanced AI</option>
        </select>
      </div>

      <div class="setting-row">
        <span>Thinking Timer</span>
        <select id="timerSelect" onchange="setTimerMode(this.value)">
          <option value="0">Disabled</option>
          <option value="300">5 Minutes</option>
          <option value="600" selected>10 Minutes</option>
        </select>
      </div>

      <div class="setting-row">
        <span>King Safety Warning</span>
        <input type="checkbox" id="warningToggle" checked>
      </div>

      <div class="setting-row">
        <span>Dramatic Music</span>
        <input type="checkbox" id="musicToggle" onchange="toggleMusic(this.checked)">
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script>
    let game = new Chess();
    let selectedSquare = null;
    let pieceMode = 'classic';
    let timerSeconds = 600, timerInterval = null, timerEnabled = true;

    const classicSymbols = {
      'w': { 'p': '♙', 'r': '♖', 'n': '♘', 'b': '♗', 'q': '♕', 'k': '♔' },
      'b': { 'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚' }
    };

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let musicInterval = null;

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      if (type === 'move' || type === 'capture') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(type === 'capture' ? 80 : 130, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'checkmate') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 1.5);
        gain.gain.setValueAtTime(1.0, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 1.5);
      }
    }

    function toggleMusic(enable) {
      if (enable) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        let step = 0;
        const notes = [65.41, 69.30, 58.27, 55.00];
        musicInterval = setInterval(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(notes[step % 4], audioCtx.currentTime);
          gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + 2.5);
          step++;
        }, 2500);
      } else if (musicInterval) clearInterval(musicInterval);
    }

    function renderBoard() {
      const grid = document.getElementById('chessGrid');
      grid.innerHTML = '';
      const boardState = game.board();

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sqName = String.fromCharCode(97 + c) + (8 - r);
          const sqDiv = document.createElement('div');
          sqDiv.className = `square ${(r + c) % 2 === 0 ? 'sq-l' : 'sq-d'}`;
          sqDiv.dataset.square = sqName;

          const piece = boardState[r][c];
          if (piece) {
            if (pieceMode === 'go') {
              const stone = document.createElement('div');
              stone.className = `go-piece ${piece.color === 'w' ? 'go-white' : 'go-black'}`;
              stone.innerText = classicSymbols[piece.color][piece.type];
              sqDiv.appendChild(stone);
            } else {
              sqDiv.innerHTML = classicSymbols[piece.color][piece.type];
              sqDiv.style.color = piece.color === 'w' ? '#ffffff' : '#050505';
              sqDiv.style.textShadow = piece.color === 'w' ? '0 2px 4px #000' : '0 1px 2px #fff';
            }
          }

          if (selectedSquare === sqName) sqDiv.classList.add('sq-selected');
          sqDiv.onclick = () => onSquareClick(sqName);
          grid.appendChild(sqDiv);
        }
      }
    }

    function onSquareClick(sq) {
      if (!selectedSquare) {
        const piece = game.get(sq);
        if (piece && piece.color === game.turn()) {
          selectedSquare = sq;
          renderBoard();
          showHints(sq);
        }
        return;
      }

      const move = game.move({ from: selectedSquare, to: sq, promotion: 'q' });
      if (move) {
        playSound(move.captured ? 'capture' : 'move');
        selectedSquare = null;
        renderBoard();
        checkGameState();

        if (!game.game_over() && game.turn() === 'b') {
          setTimeout(makeAdvancedAIMove, 350);
        }
      } else {
        selectedSquare = null;
        renderBoard();
      }
    }

    function showHints(sq) {
      game.moves({ square: sq, verbose: true }).forEach(m => {
        const el = document.querySelector(`[data-square="${m.to}"]`);
        if (el) el.classList.add('sq-hint');
      });
    }

    // High-End Advanced AI (Level 11 Strong Engine)
    function evaluateBoard(board) {
      const values = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };
      let totalEval = 0;
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const piece = board[r][c];
          if (piece) {
            const val = values[piece.type];
            totalEval += (piece.color === 'b' ? val : -val);
          }
        }
      }
      return totalEval;
    }

    function minimax(depth, isMaximizing, alpha, beta) {
      if (depth === 0 || game.game_over()) return evaluateBoard(game.board());
      const moves = game.moves();
      if (isMaximizing) {
        let maxEval = -99999;
        for (let m of moves) {
          game.move(m);
          let evaluation = minimax(depth - 1, false, alpha, beta);
          game.undo();
          maxEval = Math.max(maxEval, evaluation);
          alpha = Math.max(alpha, evaluation);
          if (beta <= alpha) break;
        }
        return maxEval;
      } else {
        let minEval = 99999;
        for (let m of moves) {
          game.move(m);
          let evaluation = minimax(depth - 1, true, alpha, beta);
          game.undo();
          minEval = Math.min(minEval, evaluation);
          beta = Math.min(beta, evaluation);
          if (beta <= alpha) break;
        }
        return minEval;
      }
    }

    function makeAdvancedAIMove() {
      const level = parseInt(document.getElementById('aiLevel').value);
      const moves = game.moves();
      if (moves.length === 0) return;

      let bestMove = moves[0];
      if (level >= 8) {
        // High intelligence search
        let bestVal = -99999;
        for (let m of moves) {
          game.move(m);
          let val = minimax(2, false, -100000, 100000);
          game.undo();
          if (val > bestVal) {
            bestVal = val;
            bestMove = m;
          }
        }
      } else {
        bestMove = moves[Math.floor(Math.random() * moves.length)];
      }

      const move = game.move(bestMove);
      playSound(move.captured ? 'capture' : 'move');
      renderBoard();
      checkGameState();
    }

    function checkGameState() {
      if (game.in_checkmate()) {
        playSound('checkmate');
        document.getElementById('fallingKingIcon').innerText = game.turn() === 'w' ? '♔' : '♚';
        document.getElementById('bannerOverlay').style.display = 'block';
      } else {
        const turn = game.turn() === 'w' ? 'WHITE TO MOVE' : 'BLACK TO MOVE';
        document.getElementById('turnText').innerText = game.in_check() ? 'CHECK! ' + turn : turn;
        if (game.in_check() && document.getElementById('warningToggle').checked) {
          playSound('move');
        }
      }
    }

    function setViewMode(mode) { document.getElementById('boardFrame').className = `board-frame ${mode} ${document.getElementById('woodTheme').value}`; }
    function setWoodTheme(theme) {
      const mode = document.getElementById('viewMode').value;
      document.getElementById('boardFrame').className = `board-frame ${mode} ${theme}`;
    }
    function setPieceStyle(style) { pieceMode = style; renderBoard(); }
    
    function setTimerMode(val) {
      timerSeconds = parseInt(val);
      timerEnabled = timerSeconds > 0;
      document.getElementById('wTimer').style.display = timerEnabled ? 'block' : 'none';
      document.getElementById('bTimer').style.display = timerEnabled ? 'block' : 'none';
    }

    function undoMove() { game.undo(); game.undo(); selectedSquare = null; renderBoard(); }
    function restartGame() {
      game.reset(); selectedSquare = null;
      document.getElementById('bannerOverlay').style.display = 'none';
      renderBoard();
    }

    function startGame() { document.getElementById('portalMenu').style.display = 'none'; renderBoard(); }
    function showPortal() { document.getElementById('portalMenu').style.display = 'flex'; }
    function toggleModal(show) { document.getElementById('optionsModal').style.display = show ? 'flex' : 'none'; }

    renderBoard();
  </script>
</body>
</html>
