<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Imperial Chess Master 3D</title>
  <style>
    :root {
      --bg-radial: radial-gradient(circle at center, #2c1a0e 0%, #0a0503 100%);
      --gold-main: #d4af37;
      --gold-light: #fff3a8;
      --wood-dark: #4a2810;
      --wood-light: #d8b888;
      --panel-marble: linear-gradient(135deg, #281d18 0%, #110a07 100%);
    }

    * {
      box-sizing: border-box;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg-radial);
      color: #e5e5e5;
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Portal Menu (Main Screen) */
    .portal-screen {
      position: fixed;
      inset: 0;
      background: var(--bg-radial);
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 20px;
    }

    .portal-title {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--gold-main);
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
      margin-bottom: 20px;
      text-align: center;
    }

    .menu-btn {
      width: 85vw;
      max-width: 320px;
      padding: 16px;
      background: linear-gradient(180deg, #4a3319 0%, #211307 100%);
      border: 2px solid var(--gold-main);
      border-radius: 8px;
      color: var(--gold-light);
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.2);
      transition: all 0.2s;
      text-align: center;
    }

    .menu-btn:active {
      transform: scale(0.97);
      background: var(--gold-main);
      color: #000;
    }

    /* Game Interface */
    .app-header {
      width: 92vw;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .icon-btn {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--gold-main);
      color: var(--gold-main);
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; cursor: pointer;
    }

    .board-container {
      width: 92vw;
      height: 92vw;
      max-width: 400px;
      max-height: 400px;
      position: relative;
      perspective: 800px;
    }

    .board-frame {
      width: 100%; height: 100%;
      background: linear-gradient(145deg, #3d2410, #180d05);
      border-radius: 12px;
      padding: 10px;
      border: 3px solid var(--gold-main);
      box-shadow: 0 20px 40px rgba(0,0,0,0.9), 0 0 15px rgba(212, 175, 55, 0.2);
      transition: transform 0.4s ease;
    }

    .board-frame.mode-3d {
      transform: rotateX(25deg) scale(0.95);
    }

    .board-frame.mode-2d {
      transform: rotateX(0deg) scale(1);
    }

    .chess-grid {
      width: 100%; height: 100%;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      border-radius: 4px;
      overflow: hidden;
    }

    .square {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem;
      cursor: pointer;
    }

    .sq-light { background-color: var(--wood-light); }
    .sq-dark { background-color: var(--wood-dark); }

    .sq-selected {
      box-shadow: inset 0 0 0 3px var(--gold-light) !important;
      background-color: rgba(212, 175, 55, 0.6) !important;
    }

    .sq-hint::after {
      content: '';
      width: 30%; height: 30%;
      background: rgba(212, 175, 55, 0.8);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--gold-light);
    }

    /* Banner Overlay (Checkmate) */
    .banner-overlay {
      position: absolute;
      top: 35%; left: 5%; right: 5%;
      background: var(--panel-marble);
      border: 2px solid var(--gold-main);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      display: none;
      z-index: 50;
    }

    .banner-title {
      font-size: 1.5rem;
      color: #ef4444;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    /* Controls & Status */
    .status-panel {
      width: 92vw; max-width: 400px;
      margin-top: 15px;
      background: var(--panel-marble);
      border: 1px solid var(--gold-main);
      border-radius: 8px;
      padding: 10px 15px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.9rem; font-weight: bold;
    }

    .controls {
      width: 92vw; max-width: 400px;
      margin-top: 10px;
      display: flex; gap: 10px;
    }

    .ctrl-btn {
      flex: 1; padding: 12px;
      background: linear-gradient(180deg, #3d2817 0%, #1a1008 100%);
      border: 1px solid var(--gold-main);
      color: var(--gold-main);
      border-radius: 6px; font-weight: bold;
      cursor: pointer; text-align: center;
    }

    .modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center;
      z-index: 300;
    }

    .modal-content {
      background: #1a110a;
      border: 2px solid var(--gold-main);
      border-radius: 12px;
      width: 88vw; max-width: 360px;
      padding: 20px;
    }

    .setting-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid rgba(212,175,55,0.2);
    }

    select, input[type="checkbox"] {
      background: #000; color: var(--gold-main);
      border: 1px solid var(--gold-main); padding: 6px; border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- PORTAL MENU -->
  <div class="portal-screen" id="portalMenu">
    <div class="portal-title">Imperial Chess</div>
    <div class="menu-btn" onclick="startGame()">⚔ SINGLE PLAYER</div>
    <div class="menu-btn" onclick="toggleModal(true)">⚙ OPTIONS</div>
  </div>

  <!-- GAME INTERFACE -->
  <div class="app-header">
    <button class="icon-btn" onclick="showPortal()">🏠</button>
    <div style="font-weight:bold; color:var(--gold-main); letter-spacing:2px;">IMPERIAL CHESS</div>
    <button class="icon-btn" onclick="toggleModal(true)">⚙</button>
  </div>

  <div class="board-container">
    <div class="board-frame mode-3d" id="boardFrame">
      <div class="chess-grid" id="chessGrid"></div>
    </div>
    
    <div class="banner-overlay" id="bannerOverlay">
      <div class="banner-title" id="bannerTitle">ÉCHEC ET MAT!</div>
      <div id="bannerSub" style="color:var(--gold-light);">Your opponent won!</div>
    </div>
  </div>

  <div class="status-panel">
    <span id="turnText" style="color:var(--gold-main);">WHITE TO MOVE</span>
    <span id="timerText" style="font-family:monospace; font-size:1.1rem;">10:00</span>
  </div>

  <div class="controls">
    <button class="ctrl-btn" onclick="undoMove()">↩ UNDO</button>
    <button class="ctrl-btn" onclick="restartGame()">⚔ RESTART</button>
  </div>

  <!-- OPTIONS MODAL -->
  <div class="modal" id="optionsModal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3 style="margin:0; color:var(--gold-main);">OPTIONS</h3>
        <button class="icon-btn" style="width:30px; height:30px;" onclick="toggleModal(false)">✕</button>
      </div>

      <div class="setting-row">
        <span>View Mode</span>
        <select id="viewMode" onchange="setViewMode(this.value)">
          <option value="mode-3d">3D View</option>
          <option value="mode-2d">2D Flat View</option>
        </select>
      </div>

      <div class="setting-row">
        <span>AI Level</span>
        <select id="aiLevel">
          <option value="1">1. Novice</option>
          <option value="2">2. Learner</option>
          <option value="3">3. Apprentice</option>
          <option value="4">4. Intermediate</option>
          <option value="5">5. Advanced</option>
          <option value="6">6. Expert</option>
          <option value="7">7. Genius</option>
          <option value="8">8. Master</option>
          <option value="9">9. Kasparov Level</option>
          <option value="10">10. Grandmaster</option>
          <option value="11" selected>11. Highly Advanced AI</option>
        </select>
      </div>

      <div class="setting-row">
        <span>Dramatic Music</span>
        <input type="checkbox" id="musicToggle" onchange="toggleMusic(this.checked)">
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script>
    let game = new Chess();
    let selectedSquare = null;
    const pieceSymbols = {
      'w': { 'p': '♙', 'r': '♖', 'n': '♘', 'b': '♗', 'q': '♕', 'k': '♔' },
      'b': { 'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚' }
    };

    // Web Audio Synthesizer (Wood Sounds, Checkmate Fanfare & Audiomachine Orchestra)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let musicInterval = null;

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      if (type === 'move' || type === 'capture') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(type === 'capture' ? 80 : 140, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'checkmate') {
        // Dramatic Low Brass Fanfare
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(110, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(55, audioCtx.currentTime + 1.2);
        gain.gain.setValueAtTime(0.9, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 1.2);
      }
    }

    function toggleMusic(enable) {
      if (enable) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        let step = 0;
        const notes = [65.41, 69.30, 58.27, 55.00];
        musicInterval = setInterval(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(notes[step % 4], audioCtx.currentTime);
          gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.4);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + 2.4);
          step++;
        }, 2500);
      } else if (musicInterval) clearInterval(musicInterval);
    }

    // Render Grid
    function renderBoard() {
      const grid = document.getElementById('chessGrid');
      grid.innerHTML = '';
      const boardState = game.board();

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sqName = String.fromCharCode(97 + c) + (8 - r);
          const sqDiv = document.createElement('div');
          sqDiv.className = `square ${(r + c) % 2 === 0 ? 'sq-light' : 'sq-dark'}`;
          sqDiv.dataset.square = sqName;

          const piece = boardState[r][c];
          if (piece) {
            sqDiv.innerHTML = pieceSymbols[piece.color][piece.type];
            sqDiv.style.color = piece.color === 'w' ? '#fff' : '#000';
            sqDiv.style.textShadow = piece.color === 'w' ? '0 2px 4px #000' : '0 1px 2px #fff';
          }

          if (selectedSquare === sqName) sqDiv.classList.add('sq-selected');

          sqDiv.onclick = () => onSquareClick(sqName);
          grid.appendChild(sqDiv);
        }
      }
    }

    function onSquareClick(sq) {
      if (!selectedSquare) {
        const piece = game.get(sq);
        if (piece && piece.color === game.turn()) {
          selectedSquare = sq;
          renderBoard();
          showHints(sq);
        }
        return;
      }

      const move = game.move({ from: selectedSquare, to: sq, promotion: 'q' });
      if (move) {
        playSound(move.captured ? 'capture' : 'move');
        selectedSquare = null;
        renderBoard();
        checkGameState();

        if (!game.game_over() && game.turn() === 'b') {
          setTimeout(makeAIMove, 300);
        }
      } else {
        selectedSquare = null;
        renderBoard();
      }
    }

    function showHints(sq) {
      const moves = game.moves({ square: sq, verbose: true });
      moves.forEach(m => {
        const el = document.querySelector(`[data-square="${m.to}"]`);
        if (el) el.classList.add('sq-hint');
      });
    }

    function makeAIMove() {
      const moves = game.moves();
      if (moves.length === 0) return;
      const move = game.move(moves[Math.floor(Math.random() * moves.length)]);
      playSound(move.captured ? 'capture' : 'move');
      renderBoard();
      checkGameState();
    }

    function checkGameState() {
      if (game.in_checkmate()) {
        playSound('checkmate');
        document.getElementById('bannerOverlay').style.display = 'block';
      } else {
        document.getElementById('turnText').innerText = game.turn() === 'w' ? 'WHITE TO MOVE' : 'BLACK TO MOVE';
      }
    }

    function setViewMode(mode) {
      document.getElementById('boardFrame').className = `board-frame ${mode}`;
    }

    function undoMove() {
      game.undo(); game.undo();
      selectedSquare = null;
      renderBoard();
    }

    function restartGame() {
      game.reset();
      selectedSquare = null;
      document.getElementById('bannerOverlay').style.display = 'none';
      renderBoard();
    }

    function startGame() { document.getElementById('portalMenu').style.display = 'none'; renderBoard(); }
    function showPortal() { document.getElementById('portalMenu').style.display = 'flex'; }
    function toggleModal(show) { document.getElementById('optionsModal').style.display = show ? 'flex' : 'none'; }

    renderBoard();
  </script>
</body>
</html>
